[tool.ruff]
line-length = 120
target-version = "py310"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402"]  # notebooks/scripts add the repo root to sys.path before importing src

[tool.ruff.lint.isort]
known-first-party = ["src", "model_lib", "inference", "preprocess"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
